services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miamzy
      POSTGRES_USER: miamzy
      POSTGRES_PASSWORD: miamzy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miamzy -d miamzy"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - miamzy_postgres:/var/lib/postgresql/data

volumes:
  miamzy_postgres:
